services:
  mysql_container:
    env_file:
      - .env
    container_name: mysql_container
    hostname: mysql_container
    image: mysql:8.4
    restart: always

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - ./mysql_container_backup:/var/lib/mysql

    ports:
      - "3306:3306"

    environment:
      TZ: America/Sao_Paulo
